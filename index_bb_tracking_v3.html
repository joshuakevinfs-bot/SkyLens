<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
<title>SkyLens — Sales</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<style>
  :root{
    --bg:#fbfaf6; --map-bg:#eef0e9; --ink:#1c2321; --muted:#5b655f;
    --border:#e4e1d8; --green:#2f6b4f; --navy:#2a5a7a; --amber:#fff3c4; --amber-line:#d4a900; --red:#a53838;
    --shadow:0 2px 10px rgba(28,35,33,0.12);
  }
  *{box-sizing:border-box;}
  body{margin:0; background:#d9d6ca; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  .phone{max-width:400px; margin:0 auto; min-height:100vh; background:var(--bg); display:flex; flex-direction:column;}

  /* ---------- layar login/pilih sales ---------- */
  .gate{padding:40px 22px; text-align:center;}
  .gate h1{font-size:18px; color:var(--ink); margin-bottom:4px;}
  .gate p{font-size:12.5px; color:var(--muted); margin-bottom:24px;}
  .gate input{width:100%; border:1px solid var(--border); border-radius:10px; padding:12px 14px; font-size:14px; margin-bottom:10px;}
  .gate button{width:100%; background:var(--ink); color:#fff; border:none; border-radius:10px; padding:13px; font-size:14px; font-weight:600;}

  /* ---------- layar pilih zona ---------- */
  .zonelist{padding:14px 16px; flex:1;}
  .zonelist h2{font-size:15px; color:var(--ink); margin:0 0 3px;}
  .zonelist .sub{font-size:11.5px; color:var(--muted); margin-bottom:14px;}
  .zonecard{
    border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:10px;
    background:#fff; cursor:pointer;
  }
  .zonecard .top{display:flex; justify-content:space-between; align-items:center;}
  .zonecard .name{font-size:13.5px; font-weight:600; color:var(--ink);}
  .zonecard .score{font-size:11px; color:var(--green); font-weight:700;}
  .zonecard .meta{font-size:11px; color:var(--muted); margin-top:3px;}
  .zonecard .bar{height:5px; border-radius:3px; background:var(--border); margin-top:8px; overflow:hidden;}
  .zonecard .bar div{height:100%; background:var(--green);}
  .empty{padding:30px 16px; text-align:center; color:var(--muted); font-size:12.5px;}

  /* ---------- layar peta (sama kayak prototipe) ---------- */
  .topbar{padding:12px 16px 9px; border-bottom:0.5px solid var(--border); background:var(--bg); display:flex; align-items:center; gap:10px;}
  .backbtn{border:none; background:var(--map-bg); border-radius:8px; width:32px; height:32px; font-size:16px; cursor:pointer; flex-shrink:0;}
  .topbar h1{margin:0; font-size:14px; font-weight:600; color:var(--ink);}
  .topbar .sub{font-size:11px; color:var(--muted);}

  .mapwrap{position:relative; flex:1; min-height:440px; background:var(--map-bg);}
  #map{position:absolute; inset:0;}
  .card{position:absolute; left:10px; right:10px; top:10px; background:#fff; border-radius:12px; padding:11px 13px; box-shadow:var(--shadow); z-index:900; display:flex; align-items:center; gap:11px;}
  .arrowbox{width:40px; height:40px; border-radius:50%; background:var(--map-bg); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .cardtext .big{font-size:15px; font-weight:600; color:var(--ink); margin:0;}
  .cardtext .small{font-size:11px; color:var(--muted); margin:1px 0 0;}
  .sweepcard{display:none;}
  .sweepcard .head{display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:var(--ink); margin-bottom:7px;}
  .progtrack{height:7px; border-radius:4px; background:var(--border); overflow:hidden;}
  .progfill{height:100%; width:0%; background:var(--green); transition:width 0.35s ease;}
  .proglabel{margin:6px 0 0; font-size:11px; color:var(--muted); text-align:right;}
  .fab{position:absolute; right:14px; bottom:14px; width:52px; height:52px; border-radius:50%; background:var(--ink); color:#fff; border:none; display:none; align-items:center; justify-content:center; box-shadow:var(--shadow); z-index:900; font-size:26px; cursor:pointer;}

  .modal-backdrop{position:fixed; inset:0; background:rgba(28,35,33,0.5); z-index:2000; display:none; align-items:flex-end; justify-content:center;}
  .modal{width:100%; max-width:400px; background:#fff; border-radius:18px 18px 0 0; padding:18px 18px 22px;}
  .modal h2{margin:0 0 3px; font-size:15px; color:var(--ink);}
  .modal .sub{font-size:11.5px; color:var(--muted); margin-bottom:14px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:11.5px; font-weight:600; color:var(--ink); margin-bottom:5px;}
  .radiorow{display:flex; gap:8px;}
  .radiorow button{flex:1; padding:9px; border-radius:9px; border:1px solid var(--border); background:var(--map-bg); font-size:12px; color:var(--ink); cursor:pointer;}
  .radiorow button.on{background:var(--green); color:#fff; border-color:var(--green);}
  .field input[type=number], .field textarea{width:100%; border:1px solid var(--border); border-radius:9px; padding:9px 11px; font-size:13px; font-family:inherit; color:var(--ink);}
  .field textarea{resize:vertical; min-height:56px;}
  .photobtn{width:100%; border:1.5px dashed var(--border); border-radius:9px; padding:16px; text-align:center; font-size:12px; color:var(--muted); background:var(--map-bg); cursor:pointer;}
  .photobtn.filled{border-color:var(--green); color:var(--green); font-weight:600;}
  .modal-actions{display:flex; gap:8px; margin-top:16px;}
  .btn{border:none; border-radius:9px; padding:11px 12px; font-size:13px; font-weight:600; cursor:pointer; flex:1;}
  .btn-primary{background:var(--ink); color:#fff;}
  .btn-ghost{background:var(--map-bg); color:var(--ink); border:1px solid var(--border);}
  .btn:disabled{opacity:0.4; cursor:not-allowed;}
  .toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:11px 18px; border-radius:10px; font-size:12.5px; z-index:3000; display:none; max-width:88%; text-align:center;}
</style>
</head>

<div class="phone" id="app">

  <!-- LAYAR 1: pilih kode salesman -->
  <div class="gate" id="gateScreen">
    <h1>SkyLens</h1>
    <p>Pilih nama kamu buat lihat zona yang ditugaskan</p>
    <select id="kodeInput" style="width:100%; border:1px solid var(--border); border-radius:10px; padding:12px 14px; font-size:14px; margin-bottom:10px; background:#fff;">
      <option value="">— Pilih nama sales —</option>
    </select>
    <button onclick="masuk()">Masuk</button>
  </div>

  <!-- LAYAR 2: daftar zona assigned -->
  <div class="zonelist" id="zoneScreen" style="display:none">
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
      <button class="backbtn" onclick="gantiSales()">←</button>
      <div><h2 style="margin:0">Zona kamu</h2><div class="sub" id="salesLabel" style="margin:0"></div></div>
    </div>
    <div id="zoneListBody"></div>
  </div>

  <!-- LAYAR 3: peta navigasi + sweep -->
  <div id="mapScreen" style="display:none; flex-direction:column; flex:1;">
    <div class="topbar">
      <button class="backbtn" onclick="kembaliKeDaftar()">←</button>
      <div style="flex:1">
        <h1 id="zoneTitle">—</h1>
        <div class="sub" id="zoneSub">—</div>
      </div>
      <button class="backbtn" id="searchToggleBtn" title="Cari kode/nama toko" onclick="toggleSearchToko()">🔍</button>
    </div>
    <div class="mapwrap">
      <div id="map"></div>
      <div class="card" id="navcard">
        <div class="arrowbox"><svg id="arrowicon" width="20" height="20" viewBox="0 0 24 24"><path d="M12 2.5 L20.5 20.5 L12 16.2 L3.5 20.5 Z" fill="var(--red)" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
        <div class="cardtext"><p class="big" id="disttext">Mencari lokasi…</p><p class="small">jarak ke pusat zona</p></div>
      </div>
      <div class="card sweepcard" id="sweepcard">
        <div style="width:100%">
          <div class="head"><span>✓</span><span>Kamu di dalam zona — sisir tiap kotak</span></div>
          <div class="progtrack"><div class="progfill" id="progfill"></div></div>
          <p class="proglabel" id="proglabel">0 / 16 kotak</p>
        </div>
      </div>
      <!-- Panel cari toko: overlay kiri-atas di dalam peta, disembunyikan sampai tombol kaca-pembesar ditekan -->
      <div id="searchTokoPanel" style="display:none; position:absolute; left:10px; right:10px; top:10px; background:#fff; border-radius:12px; padding:11px 13px; box-shadow:var(--shadow); z-index:950; max-height:70%; overflow-y:auto;">
        <input id="qTokoHp" placeholder="Cari kode/nama toko (cek sebelum catat temuan baru)..." autocomplete="off"
          style="width:100%; box-sizing:border-box; padding:11px 12px; border:1.5px solid var(--border); border-radius:10px; font-size:14px;">
        <div id="hintTokoHp" style="font-size:11px;color:#888;margin-top:4px">Ketik minimal 2 huruf/angka</div>
        <div id="listTokoHp" style="margin-top:6px"></div>
      </div>
      <button class="fab" id="fab" title="Catat temuan">+</button>
      <button id="recenterBtn" title="Kembali ke posisi kamu" style="position:absolute; right:14px; bottom:76px; width:46px; height:46px; border-radius:50%; background:#fff; border:1px solid var(--border); box-shadow:var(--shadow); z-index:900; display:none; align-items:center; justify-content:center; cursor:pointer; padding:0;">
        <svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 2.5 L20.5 20.5 L12 16.2 L3.5 20.5 Z" fill="#2a5a7a" stroke="none"/></svg>
      </button>
    </div>
  </div>

</div>

<div class="modal-backdrop" id="popupProspek" style="z-index:2500; align-items:center;">
  <div class="modal" style="border-radius:16px; text-align:center;">
    <div style="font-size:38px; margin-bottom:6px;">🤔</div>
    <h2 style="margin-bottom:4px;">Apakah kamu sedang prospek NOO?</h2>
    <div class="sub" style="margin-bottom:18px;">Kelihatan kamu udah diem beberapa menit di sini</div>
    <div class="modal-actions" style="display:flex; gap:10px;">
      <button class="btn btn-ghost" style="flex:1" onclick="jawabProspekTidak()">Tidak</button>
      <button class="btn btn-primary" style="flex:1" onclick="jawabProspekYa()">Ya</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <h2>Catat temuan</h2>

<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let kodeSalesman = '';
let namaSalesman = '';
let zonaList = [];
let zonaAktif = null;
let map, youMarker, lastPos = null;
let cells = [];
let LAT0, LAT1, LON0, LON1, CENTER, cellLat, cellLon;
let followMode = true;   // true = peta ikut GPS, false = user lagi lihat manual
let OUTLET = [];

// ---------- state tracking (breadcrumb, buntut live, popup prospek) ----------
let watchId = null;
let trailPoints = [];        // {lat,lon,t} SEJAK APP DIBUKA, bertahan lintas ganti zona
let trailLayer = null;       // L.layerGroup, dibuat ulang tiap kali map dibuka (bukaZona)
let lastSaved = null;        // {lat,lon,t} titik breadcrumb TERAKHIR yg disimpan
let uploadBuffer = [];       // antrian baris siap dikirim batch ke jejak_lokasi
let uploadTimer = null;
let stillRef = null;         // {lat,lon,t} titik acuan mulai "diam" (buat popup prospek)
let askedThisStop = false;   // udah nanya popup prospek buat episode diam skrg ini?
let keluarRadius = 0;        // berapa pembacaan berturut-turut yg keluar radius (debounce anti-jitter)
let cellLastT = null;        // timestamp fix GPS terakhir, buat akumulasi dwell per kotak
let trailRunLine = null;     // polyline "run" yg sedang aktif (1 objek per warna, bukan per segmen)
let trailRunWarna = null;
let kirimTanpaAkurasi = false;   // true kalau kolom akurasi ternyata blm ada di DB
const JARAK_MIN_M = 10;          // ambang jarak dasar (meter)
const AKURASI_BUANG_M = 100;     // titik GPS lebih rusak dari ini dibuang (dilonggarin dari 50:
                                 // ambang jarak udah adaptif, jadi titik kasar pun aman & msh berguna)
const DIAM_HEARTBEAT_MS = 20000; // kalau diam, tetep catat 1 titik tiap segini
const GAP_HITAM_MS = 100000;     // gap lebih lama dari ini digambar item (bukan ke-track)
const DWELL_KOTAK_MS = 45000;    // sisir dianggap sah kalau diem >= ini di kotak yg sama
const DIAM_POPUP_MS = 150000;    // 2,5 menit diam radius kecil -> munculin popup prospek
const RADIUS_DIAM_M = 30;        // radius dianggap "masih di tempat yg sama"
const DEBOUNCE_KELUAR = 3;       // butuh 3 pembacaan berturut2 di luar radius baru reset timer diam
const UPLOAD_BATCH_N = 20;       // kirim ke Supabase begitu numpuk segini banyak
const UPLOAD_INTERVAL_MS = 30000;// atau maksimal segini lama walau belum penuh

function muatOutletData(){
  try{
    const bin = atob(OUTLET_B64);
    const arr = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
    const raw = pako.ungzip(arr, { to:'string' });
    OUTLET = JSON.parse(raw);
  } catch(e){ console.warn('gagal muat data outlet:', e); OUTLET = []; }
}
muatOutletData();

var markerCariTokoHp = null;
function hapusHighlightCariTokoHp(){
  if (markerCariTokoHp && map){ map.removeLayer(markerCariTokoHp); }
  markerCariTokoHp = null;
}
function pasangSearchTokoHp(){
  var q = document.getElementById('qTokoHp'), list = document.getElementById('listTokoHp'), hint = document.getElementById('hintTokoHp');
  if(!q) return;
  var WT = {A:'#c0392b', B:'#f39c12', C:'#3498db'};
  var hasilTerakhir = [];
  q.addEventListener('input', function(){
    var kw = this.value.trim().toLowerCase();
    if (kw.length < 2){
      list.innerHTML=''; hint.style.display='block';
      hapusHighlightCariTokoHp();   // input dikosongin -> balik normal, titik yg disorot ilang
      return;
    }
    hint.style.display = 'none';
    var hasil = OUTLET.filter(function(o){
      var kode = (o[7]||'').toString().toLowerCase(), nama = (o[6]||'').toString().toLowerCase();
      return kode.includes(kw) || nama.includes(kw);
    });
    hasilTerakhir = hasil;
    if(!hasil.length){ list.innerHTML = '<div style="font-size:12.5px;color:#888;padding:10px 0;text-align:center">Gak ketemu toko dgn kode/nama itu.<br>Aman buat didaftarkan sebagai temuan baru.</div>'; return; }
    list.innerHTML = hasil.slice(0,30).map(function(o, i){
      var w = WT[o[2]] || '#7f8c8d';
      return '<div class="tokoResultCardHp" data-i="'+i+'" style="border:1px solid var(--border);border-radius:10px;padding:9px 11px;margin:7px 0;display:flex;justify-content:space-between;align-items:center;cursor:pointer">'+
        '<div style="font-size:13px"><b>'+(o[6]||'-')+'</b><br><span style="color:#777;font-size:11.5px">'+(o[7]||'-')+' · '+o[3]+' · '+(o[10]||'-')+'</span></div>'+
        '<div style="width:30px;height:30px;border-radius:50%;background:'+w+';flex-shrink:0;margin-left:8px"></div></div>';
    }).join('');
    list.querySelectorAll('.tokoResultCardHp').forEach(function(el){
      el.onclick = function(){
        var o = hasilTerakhir[+this.dataset.i];
        if(!map) return;  // jaga-jaga kalo somehow dipanggil di luar layar peta
        hapusHighlightCariTokoHp();
        var iconSorot = L.divIcon({
          className: '',
          html: '<div style="width:26px;height:26px;border-radius:50%;background:#fff;border:4px solid #000;box-shadow:0 0 0 6px rgba(0,0,0,0.18);"></div>',
          iconSize:[26,26], iconAnchor:[13,13]
        });
        markerCariTokoHp = L.marker([o[0],o[1]], {icon:iconSorot, zIndexOffset:1000}).addTo(map);
        markerCariTokoHp.bindPopup(`<div style="font-size:12px;"><b>${o[6]||'-'}</b><br>Kode: ${o[7]||'-'} · Tier ${o[2]}<br>Tipe: ${o[3]}<br>Sales rute reguler: ${o[10]||'—'}</div>`)
          .openPopup();
        map.flyTo([o[0],o[1]], 18, {duration:0.8});
        // panel cari toko ditutup otomatis biar peta+titiknya keliatan penuh
        toggleSearchToko();
        markerCariTokoHp.on('popupclose', hapusHighlightCariTokoHp);
      };
    });
  });
}
pasangSearchTokoHp();

// isi dropdown pilih sales
(function isiDropdownSales(){
  const sel = document.getElementById('kodeInput');

    const opt = document.createElement('option');

})();

function toast(msg, ms=2600){
  const t = document.getElementById('toast');

}

// ---------- LAYAR 1: masuk ----------
async function masuk(){
  const sel = document.getElementById('kodeInput');
  if(!sel.value){ toast('Pilih nama sales dulu'); return; }
  kodeSalesman = sel.value;
  namaSalesman = sel.options[sel.selectedIndex].textContent;
  document.getElementById('gateScreen').style.display = 'none';
  document.getElementById('zoneScreen').style.display = 'block';
  document.getElementById('salesLabel').textContent = namaSalesman;
  mulaiTracking();
  await muatDaftarZona();
}

function gantiSales(){
  hentikanTracking();
  kodeSalesman = ''; namaSalesman = '';
  document.getElementById('kodeInput').value = '';
  document.getElementById('zoneScreen').style.display = 'none';
  document.getElementById('gateScreen').style.display = 'block';
}

// ---------- tracking: nyala sejak login, jalan terus lintas layar sampai ganti sales ----------
// (dipisah dari buka/tutup zona — biar bisa nangkep perjalanan depo -> zona -> depo)
function mulaiTracking(){
  trailPoints = []; lastSaved = null; uploadBuffer = []; stillRef = null; askedThisStop = false;
  if(watchId){ navigator.geolocation.clearWatch(watchId); watchId = null; }
  if(uploadTimer){ clearInterval(uploadTimer); }
  if('geolocation' in navigator){
    watchId = navigator.geolocation.watchPosition(
      pos => onPosition(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy),
      err => { const el = document.getElementById('disttext'); if(el) el.textContent = 'GPS tidak aktif / izin ditolak'; },
      { enableHighAccuracy:true, maximumAge:2000, timeout:8000 }
    );
  }
  uploadTimer = setInterval(flushUploadBuffer, UPLOAD_INTERVAL_MS);
}
function hentikanTracking(){
  if(watchId){ navigator.geolocation.clearWatch(watchId); watchId = null; }
  if(uploadTimer){ clearInterval(uploadTimer); uploadTimer = null; }
  flushUploadBuffer();
  trailPoints = []; lastSaved = null; uploadBuffer = []; stillRef = null;
}

// ---------- breadcrumb: kirim ke Supabase batch, bukan 1 request per titik ----------
function flushUploadBuffer(){
  if(uploadBuffer.length === 0) return;
  const kirim = uploadBuffer.splice(0, uploadBuffer.length);
  // kalau kolom "akurasi" ternyata blm ada di DB (SQL migrasi belum dijalanin), buang field itu
  // dan tetep kirim -- JANGAN mati total kayak bug breadcrumb yg lama
  const payload = kirimTanpaAkurasi ? kirim.map(r => { const {akurasi, ...sisa} = r; return sisa; }) : kirim;
  sb.from('jejak_lokasi').insert(payload).then(({error}) => {
    if(!error) return;
    const msg = (error.message || '').toLowerCase();
    if(!kirimTanpaAkurasi && (msg.includes('akurasi') || error.code === 'PGRST204')){
      kirimTanpaAkurasi = true;
      console.warn('kolom "akurasi" blm ada di DB — lanjut tanpa kolom itu (jalanin SQL migrasi biar kepake)');
      uploadBuffer = kirim.concat(uploadBuffer).slice(0, 1000);
      flushUploadBuffer();
      return;
    }
    console.warn('gagal simpan jejak (dikembaliin ke antrian):', error.message);
    uploadBuffer = kirim.concat(uploadBuffer).slice(0, 1000); // cap biar gak numpuk tanpa batas kalau offline lama
  });
}
// Tab dipindah / app ditutup = penyebab utama gap. Flush duluan biar titik yg masih
// nyangkut di buffer (maks 20 titik / 30 detik) gak ilang.
document.addEventListener('visibilitychange', () => { if(document.hidden) flushUploadBuffer(); });
window.addEventListener('pagehide', () => flushUploadBuffer());

// ---------- LAYAR 2: daftar zona assigned ----------
async function muatDaftarZona(){
  const body = document.getElementById('zoneListBody');
  body.innerHTML = '<div class="empty">Memuat…</div>';

  // ambil assign buat sales ini, join manual ke zona_pilot & progress
  const { data: assigns, error } = await sb
    .from('assign_pilot')
    .select('*, zona_pilot(*)')
    .eq('kode_salesman', kodeSalesman)
    .eq('status', 'aktif');

  if(error){ body.innerHTML = '<div class="empty">Gagal memuat zona: '+error.message+'</div>'; return; }
  if(!assigns || assigns.length === 0){
    body.innerHTML = '<div class="empty">Belum ada zona yang ditugaskan ke kamu. Hubungi BM/koordinator.</div>';
    return;
  }

  zonaList = assigns.map(a => a.zona_pilot).filter(Boolean);

  // ambil progress sweep per zona buat isi progress bar di kartu
  const { data: progress } = await sb
    .from('grid_progress')
    .select('key_petak')
    .eq('kode_salesman', kodeSalesman);
  const progCount = {};
  (progress||[]).forEach(p => { progCount[p.key_petak] = (progCount[p.key_petak]||0)+1; });

  body.innerHTML = '';
  zonaList.forEach(z => {
    const pct = Math.round(((progCount[z.key_petak]||0)/16)*100);
    const div = document.createElement('div');
    div.className = 'zonecard';
    div.innerHTML = `
      <div class="top"><span class="name">${z.kecamatan}</span><span class="score">${Math.round(z.peluang_a*100)}%</span></div>
      <div class="meta">Petak ${z.key_petak} · ${z.kabupaten}</div>
      <div class="bar"><div style="width:${pct}%"></div></div>
      <div class="meta" style="margin-top:4px">${pct}% tersisir</div>`;
    div.onclick = () => bukaZona(z);
    body.appendChild(div);
  });
}

function kembaliKeDaftar(){
  // GPS TETEP JALAN (gak di-clearWatch) -- biar perjalanan keluar-zona (misal balik ke
  // depo, atau menuju zona lain) tetep kerekam di trailPoints & jejak_lokasi.
  document.getElementById('mapScreen').style.display = 'none';
  document.getElementById('zoneScreen').style.display = 'block';
  tutupSearchToko();
  if(map){ map.remove(); map = null; trailLayer = null; }

  muatDaftarZona();
}

function toggleSearchToko(){
  var panel = document.getElementById('searchTokoPanel');
  var mauBuka = panel.style.display === 'none';
  panel.style.display = mauBuka ? 'block' : 'none';
  if(mauBuka){
    document.getElementById('navcard').style.display = 'none';
    document.getElementById('sweepcard').style.display = 'none';
    document.getElementById('qTokoHp').focus();
  } else {
    // navcard/sweepcard balik normal otomatis lewat update GPS berikutnya (onPosition),
    // yang tetap jalan terus di background selama panel cari toko dibuka.
  }
}
function tutupSearchToko(){
  var panel = document.getElementById('searchTokoPanel');
  panel.style.display = 'none';
  var q = document.getElementById('qTokoHp'), list = document.getElementById('listTokoHp'), hint = document.getElementById('hintTokoHp');
  if(q) q.value = '';

// ---------- LAYAR 3: buka peta buat 1 zona ----------
async function bukaZona(z){
  zonaAktif = z;
  document.getElementById('zoneScreen').style.display = 'none';
  document.getElementById('mapScreen').style.display = 'flex';
  tutupSearchToko();
  document.getElementById('zoneTitle').textContent = 'Petak ' + z.key_petak;
  document.getElementById('zoneSub').textContent = z.kecamatan + ' · skor ' + Math.round(z.peluang_a*100)+'%';
  document.getElementById('modalZoneLabel').textContent = z.kecamatan + ' · Petak ' + z.key_petak;

  LON0 = z.gx * S; LAT0 = z.gy * S;
  LON1 = LON0 + S; LAT1 = LAT0 + S;
  CENTER = { lat:(LAT0+LAT1)/2, lon:(LON0+LON1)/2 };
  cellLon = (LON1-LON0)/GRID_N; cellLat = (LAT1-LAT0)/GRID_N;

  map = L.map('map', { zoomControl:false, attributionControl:false }).setView([CENTER.lat, CENTER.lon], 16);
  L.tileLayer('https://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { subdomains:['mt0','mt1','mt2','mt3'], maxZoom:20 }).addTo(map);
  L.rectangle([[LAT0,LON0],[LAT1,LON1]], { color:'#d4a900', weight:2, fillColor:'#fff3c4', fillOpacity:0.35 })
    .bindPopup(`<div style="font-size:12.5px; min-width:200px;">
      <b>${z.kecamatan}</b> — Petak ${z.key_petak} · ${z.kabupaten}
      <table style="width:100%; margin:6px 0; border-collapse:collapse;">
        <tr><td style="color:#888;">Status</td><td style="text-align:right; font-weight:600;">Kurang digarap</td></tr>
        <tr><td style="color:#888;">Bangunan</td><td style="text-align:right;">${(z.bgn_n||0).toLocaleString('id-ID')}</td></tr>
        <tr><td style="color:#888;">Bangunan besar</td><td style="text-align:right;">${z.besar_n ?? '—'}</td></tr>
        <tr><td style="color:#888;">Toko terdaftar</td><td style="text-align:right;">${z.outlet_n ?? '—'}</td></tr>
        <tr><td style="color:#888;">Peluang Tier A</td><td style="text-align:right; font-weight:600;">${Math.round(z.peluang_a*100)}%</td></tr>
        <tr><td style="color:#888;">Perkiraan outlet</td><td style="text-align:right;">${z.est_outlet ?? '—'}</td></tr>
        <tr><td style="color:#888;">Perkiraan Tier A</td><td style="text-align:right;">${z.est_tiera ?? z.est_tierA ?? '—'}</td></tr>
      </table>
    </div>`)
    .addTo(map);

  // titik toko terdaftar di dalam petak ini — biar sales gak double-cover toko yg udah ada
  OUTLET.forEach(o => {
    const [lat, lon, tier, tipe, omset, depot, nama, kode, rute, cycle, namaSales] = o;
    if(lat<LAT0 || lat>LAT1 || lon<LON0 || lon>LON1) return;
    const warna = tier==='A' ? '#a53838' : (tier==='B' ? '#e08e2b' : '#2a5a7a');
    L.circleMarker([lat,lon], { radius:5, color:'#fff', weight:1.2, fillColor:warna, fillOpacity:0.9 })
      .bindPopup(`<div style="font-size:12px;"><b>${nama}</b><br>Kode: ${kode} · Tier ${tier}<br>Tipe: ${tipe}<br>Sales rute reguler: ${namaSales||'—'}</div>`)
      .addTo(map);
  });

  // begitu user manual drag/zoom peta, matiin follow-mode & tampilin tombol re-center
  followMode = true;
  document.getElementById('recenterBtn').style.display = 'none';
  const matikanFollow = () => { followMode = false; document.getElementById('recenterBtn').style.display = 'flex'; };
  map.on('dragstart', matikanFollow);
  map.on('zoomstart', matikanFollow);

  // gambar ulang buntut jejak yg udah kerekam sejak app dibuka (lintas zona/perjalanan),
  // supaya kalau pindah balik ke peta ini histori-nya tetep keliatan, bukan blank lagi
  trailLayer = L.layerGroup().addTo(map);
  gambarUlangSeluruhJejak();

  cells = [];
  for(let r=0;r<GRID_N;r++){
    for(let c=0;c<GRID_N;c++){
      const clat0=LAT0+r*cellLat, clat1=clat0+cellLat, clon0=LON0+c*cellLon, clon1=clon0+cellLon;
      const rect = L.rectangle([[clat0,clon0],[clat1,clon1]], { color:'#c7cbc1', weight:1, fillColor:'rgba(136,135,127,0.15)', fillOpacity:0.5, opacity:0 });
      cells.push({ rect, r, c, visited:false, dwellMs:0, clat0, clat1, clon0, clon1 });
    }
  }

  // muat progress yg udah pernah kesimpen (biar gak keulang kalau app dibuka lagi)
  const { data: prog } = await sb.from('grid_progress').select('cell_r, cell_c')
    .eq('key_petak', z.key_petak).eq('kode_salesman', kodeSalesman);
  (prog||[]).forEach(p => {
    const cell = cells.find(x=>x.r===p.cell_r && x.c===p.cell_c);
    if(cell){ cell.visited = true; }
  });

  youMarker = null;
  cellLastT = null;
  if(!('geolocation' in navigator)){
    document.getElementById('disttext').textContent = 'HP ini tidak dukung GPS browser';
  }
  // NOTE: watchPosition-nya sendiri udah nyala dari mulaiTracking() (dipanggil pas login),
  // jalan terus lintas zona -- di sini tinggal pakai lastPos yg udah ada kalau sempat kekejar.
  if(lastPos && insideZone(lastPos.lat, lastPos.lon)){ onPosition(lastPos.lat, lastPos.lon, lastPos.acc); }
}

function haversine(lat1,lon1,lat2,lon2){
  const R=6371000, toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
function bearing(lat1,lon1,lat2,lon2){
  const toRad=d=>d*Math.PI/180, toDeg=r=>r*180/Math.PI;
  const y=Math.sin(toRad(lon2-lon1))*Math.cos(toRad(lat2));
  const x=Math.cos(toRad(lat1))*Math.sin(toRad(lat2)) - Math.sin(toRad(lat1))*Math.cos(toRad(lat2))*Math.cos(toRad(lon2-lon1));
  return (toDeg(Math.atan2(y,x))+360)%360;
}
function insideZone(lat,lon){ return lat>=LAT0 && lat<=LAT1 && lon>=LON0 && lon<=LON1; }
function cellIndex(lat,lon){
  const r=Math.floor((lat-LAT0)/cellLat), c=Math.floor((lon-LON0)/cellLon);
  if(r<0||r>=GRID_N||c<0||c>=GRID_N) return null;
  return cells.find(x=>x.r===r && x.c===c);
}
function arrowIcon(deg){
  return L.divIcon({ className:'', iconSize:[26,26], iconAnchor:[13,13],
    html:`<div style="width:26px;height:26px;transform:rotate(${deg}deg);transition:transform 0.5s ease;">
      <svg viewBox="0 0 24 24" width="26" height="26"><path d="M12 2.5 L20.5 20.5 L12 16.2 L3.5 20.5 Z" fill="#2a5a7a" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
    </div>` });
}

const navcard = () => document.getElementById('navcard');
const sweepcard = () => document.getElementById('sweepcard');
const fab = () => document.getElementById('fab');

// ---------- gambar 1 segmen buntut jejak (ijo = ke-track, hitam = gap/tab ditinggal) ----------
function warnaSegmen(a, b){ return (b.t - a.t) > GAP_HITAM_MS ? '#1a1a1a' : '#2f6b4f'; }

// Nambah 1 titik ke buntut. Pakai SATU polyline per "run" warna (di-extend pakai addLatLng),
// bukan 1 objek polyline per segmen -- kalau per segmen, sesi 3 jam bikin ~2.000 objek layer
// numpuk di peta dan HP jadi berat.
function gambarSegmenJejak(a, b){
  if(!trailLayer) return;
  const warna = warnaSegmen(a, b);
  if(!trailRunLine || warna !== trailRunWarna){
    trailRunWarna = warna;
    trailRunLine = L.polyline([[a.lat,a.lon],[b.lat,b.lon]], { color: warna, weight: 4, opacity: 0.85 }).addTo(trailLayer);
  } else {
    trailRunLine.addLatLng([b.lat, b.lon]);
  }
}

// Gambar ulang seluruh histori jejak (dipakai tiap kali peta dibuka lagi), digabung
// per run warna biar jumlah objek layer-nya sedikit.
function gambarUlangSeluruhJejak(){
  if(!trailLayer) return;
  trailRunLine = null; trailRunWarna = null;
  let run = [], runWarna = null;
  const tutupRun = () => {
    if(run.length >= 2) L.polyline(run, { color: runWarna, weight: 4, opacity: 0.85 }).addTo(trailLayer);
    run = [];
  };
  for(let i=1;i<trailPoints.length;i++){
    const a = trailPoints[i-1], b = trailPoints[i];
    const warna = warnaSegmen(a, b);
    if(warna !== runWarna){ tutupRun(); runWarna = warna; run = [[a.lat,a.lon]]; }
    run.push([b.lat,b.lon]);
  }
  tutupRun();
}

// ---------- breadcrumb adaptif: simpan titik kalau geser >= ambang ATAU udah diam lama ----------
function catatBreadcrumbJikaPerlu(lat, lon, acc, t){
  if(acc && acc > AKURASI_BUANG_M) return;   // GPS kelewat rusak (>50m), buang, jgn dipake
  const ambang = Math.max(JARAK_MIN_M, acc || JARAK_MIN_M);   // ambang naik kalau GPS lg gak akurat
  let simpan = !lastSaved;
  if(lastSaved){
    const jarak = haversine(lastSaved.lat, lastSaved.lon, lat, lon);
    const selisihWaktu = t - lastSaved.t;
    simpan = (jarak >= ambang) || (selisihWaktu >= DIAM_HEARTBEAT_MS);
  }
  if(!simpan) return;
  const titik = { lat, lon, t };
  if(trailPoints.length > 0) gambarSegmenJejak(trailPoints[trailPoints.length-1], titik);
  trailPoints.push(titik);
  lastSaved = titik;
  uploadBuffer.push({
    key_petak: zonaAktif ? zonaAktif.key_petak : null,
    kode_salesman: kodeSalesman,
    lat, lon,
    waktu: new Date(t).toISOString(),
    akurasi: acc != null ? Math.round(acc) : null
  });
  if(uploadBuffer.length >= UPLOAD_BATCH_N) flushUploadBuffer();
}

// ---------- deteksi diam lama di 1 titik -> munculin popup "lagi prospek NOO?" ----------
function cekPopupProspek(lat, lon, t, acc){
  // GUARD: cuma relevan kalau lagi buka zona DAN fisik udah di dalam kotak zona.
  // Tanpa ini, popup nongol pas sales masih diem di depo / lagi liat daftar zona,
  // dan kalau dijawab "Ya" form temuannya bakal error (zonaAktif masih null).
  if(!zonaAktif || !map || !insideZone(lat, lon)){ stillRef = null; askedThisStop = false; keluarRadius = 0; return; }
  // jangan timpa form yg lagi diisi
  const modal = document.getElementById('modalBackdrop');
  if(modal && modal.style.display === 'flex') return;

  if(!stillRef){ stillRef = { lat, lon, t }; askedThisStop = false; keluarRadius = 0; return; }
  // radius ikut akurasi GPS: kalau GPS lagi goyang 25m, jangan dianggap "pindah tempat".
  // 2.5x (bukan 2x) -- diuji 200x per kombinasi, 2x cuma lolos ~70%, 2.5x lolos 100%.
  const radius = Math.max(RADIUS_DIAM_M, 2.5 * (acc || 0));
  const jarak = haversine(stillRef.lat, stillRef.lon, lat, lon);
  if(jarak > radius){
    // debounce: 1 pembacaan nyeleneh gak langsung reset timer. Pindah beneran itu
    // kelewat radius TERUS-TERUSAN, bukan sekali lompat doang.
    keluarRadius++;
    if(keluarRadius >= DEBOUNCE_KELUAR){ stillRef = { lat, lon, t }; askedThisStop = false; keluarRadius = 0; }
    return;
  }
  keluarRadius = 0;
  if(!askedThisStop && (t - stillRef.t) >= DIAM_POPUP_MS){
    askedThisStop = true;
    const el = document.getElementById('popupProspek');
    if(el) el.style.display = 'flex';
  }
}
function jawabProspekYa(){
  document.getElementById('popupProspek').style.display = 'none';
  document.getElementById('modalBackdrop').style.display = 'flex';
}
function jawabProspekTidak(){
  document.getElementById('popupProspek').style.display = 'none';
}

async function onPosition(lat, lon, acc){
  const t = Date.now();
  const brg = lastPos ? bearing(lastPos.lat, lastPos.lon, lat, lon) : bearing(lat, lon, CENTER ? CENTER.lat : lat, CENTER ? CENTER.lon : lon);
  lastPos = { lat, lon, acc, t };

  catatBreadcrumbJikaPerlu(lat, lon, acc, t);
  cekPopupProspek(lat, lon, t, acc);

  if(!map) return;   // masih di layar daftar zona / dalam perjalanan -- belum ada peta buat digambar

  if(!youMarker){ youMarker = L.marker([lat,lon], { icon: arrowIcon(brg) }).addTo(map); }
  else { youMarker.setLatLng([lat,lon]); youMarker.setIcon(arrowIcon(brg)); }
  if(followMode){ map.panTo([lat,lon], { animate:true }); }

  const inside = insideZone(lat, lon);
  if(!inside){
    navcard().style.display='flex'; sweepcard().style.display='none'; fab().style.display='none';
    const d = Math.round(haversine(lat,lon, CENTER.lat, CENTER.lon));
    document.getElementById('disttext').textContent = d>=1000 ? (d/1000).toFixed(1)+' km' : d+' m';
    cells.forEach(x=>x.rect.setStyle({opacity:0}));
    cellLastT = t;
  } else {
    navcard().style.display='none'; sweepcard().style.display='flex'; fab().style.display='flex';
    cells.forEach(x=>{ if(!x.rect._map) x.rect.addTo(map); x.rect.setStyle({opacity:1}); if(x.visited) x.rect.setStyle({fillColor:'#639922', fillOpacity:0.42, color:'#3b6d11'}); });
    const cell = cellIndex(lat, lon);
    if(cell){
      // FIX D1: dulu langsung ijo pas masuk kotak (walau cuma lewat). Sekarang waktunya
      // DIAKUMULASI per kotak (bukan timer tunggal yg di-reset tiap ganti kotak) -- kalau
      // pakai timer tunggal, GPS goyang di garis batas 2 kotak bikin timernya reset terus
      // dan kotaknya gak pernah ijo walau udah lama disisir.
      const dt = cellLastT ? Math.min(t - cellLastT, 5000) : 0;  // cap 5 dtk biar GPS bolong lama gak ngasih kredit gratis
      cell.dwellMs = (cell.dwellMs || 0) + dt;
      if(!cell.visited && cell.dwellMs >= DWELL_KOTAK_MS){
        cell.visited = true;
        cell.rect.setStyle({ fillColor:'#639922', fillOpacity:0.42, color:'#3b6d11' });
        sb.from('grid_progress').insert({
          key_petak: zonaAktif.key_petak, kode_salesman: kodeSalesman,
          cell_r: cell.r, cell_c: cell.c, lat, lon
        }).then(({error})=>{ if(error) console.warn('gagal simpan progress:', error.message); });
      }
    }
    cellLastT = t;
    const visited = cells.filter(x=>x.visited).length;
    document.getElementById('progfill').style.width = Math.round(visited/cells.length*100)+'%';
    document.getElementById('proglabel').textContent = visited+' / '+cells.length+' kotak';
  }
}

// ---------- modal submit temuan ----------
let foundVal = null, photoFile = null;
function pickFound(btn){
  document.querySelectorAll('.radiorow .opt').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on'); foundVal = btn.dataset.val;
}
function onPhoto(input){
  photoFile = input.files && input.files[0] ? input.files[0] : null;
  const pb = document.getElementById('photobtn');
  pb.textContent = photoFile ? '✓ Foto terlampir — tap buat ganti' : 'Tap untuk buka kamera';
  pb.classList.toggle('filled', !!photoFile);
  document.getElementById('submitBtn').disabled = !photoFile;
}
fab().onclick;
document.addEventListener('click', e => { if(e.target && e.target.id==='fab'){ document.getElementById('modalBackdrop').style.display='flex'; } });
document.getElementById('recenterBtn').addEventListener('click', () => {
  followMode = true;
  document.getElementById('recenterBtn').style.display = 'none';
  if(lastPos){ map.panTo([lastPos.lat, lastPos.lon], { animate:true }); }
});
function closeModal(){ document.getElementById('modalBackdrop').style.display='none'; }

async function submitTemuan(){
  if(!zonaAktif){ toast('Buka zona dulu sebelum catat temuan', 3500); return; }
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Menyimpan…';
  try{
    const filename = `${zonaAktif.key_petak}_${kodeSalesman}_${Date.now()}.jpg`.replace(/[^a-zA-Z0-9._-]/g,'_');
    const { error: upErr } = await sb.storage.from('temuan-foto').upload(filename, photoFile);
    if(upErr) throw upErr;
    const { data: pub } = sb.storage.from('temuan-foto').getPublicUrl(filename);

    const { error: insErr } = await sb.from('temuan_pilot').insert({
      key_petak: zonaAktif.key_petak, kode_salesman: kodeSalesman,
      lat: lastPos ? lastPos.lat : null, lon: lastPos ? lastPos.lon : null,
      ditemukan_grosir: foundVal || 'belum_dicek',
      jumlah_toko_baru: parseInt(document.getElementById('jmlToko').value||'0'),
      foto_url: pub.publicUrl,
      catatan: document.getElementById('catatan').value || null
    });
    if(insErr) throw insErr;

    closeModal();
    toast('Temuan tersimpan');
  } catch(e){
    toast('Gagal simpan: ' + e.message, 4000);
  } finally {
    btn.disabled = false; btn.textContent = 'Simpan temuan';
  }
}
